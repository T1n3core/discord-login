<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" type="text/css" href="./css/style.css">    
        <title>Discord Login</title>
    </head>
    <body>
        <main class="login-card">
            <section class="login-section">
                <h1>Welcome back!</h1>
                <p class="subtitle">We're so excited to see you again!</p>

                <form onsubmit="return false;">
                    <label for="email">Email or Phone Number <span>*</span></label>
                    <input id="email" type="text" autocomplete="off">

                    <label for="password">Password <span>*</span></label>
                    <input id="password" type="password" autocomplete="off">

                    <a href="#" class="forgot">Forgot your password?</a>

                    <button type="button">Log In</button>
                </form>

                <p class="register">Need an account? <a href="./registration.html">Register</a></p>
            </section>

            <section class="qr-section">
                <div class="qr-placeholder">
                    <div class="qr-pattern"></div>
                </div>

                <h2>Log in with QR Code</h2>

                <p>
                    Scan this with the Discord mobile
                    <br>
                    app to log in instantly.
                </p>

                <a href="#" class="passkey">Or sign in with a passkey</a>
            </section>
        </main>
    </body>
</html>
