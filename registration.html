<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Discord Registration</title>
	<link rel="stylesheet" href="./css/shared.css">
	<link rel="stylesheet" href="./css/register.css">
	<script src="./js/page-transition.js" defer></script>
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>
	<script src="./js/demo-auth.js" defer></script>
</head>

<body>
	<main class="register-card">
		<section class="register-section">
			<h1>Create an account</h1>

			<form data-demo-form data-demo-title="Demo Registration">
				<label for="email">Email <span class="required">*</span></label>
				<input id="email" name="email" type="email" autocomplete="email" required>

				<label for="display-name">Display Name</label>
				<input id="display-name" name="displayName" type="text" autocomplete="nickname">

				<label for="username">Username <span class="required">*</span></label>
				<input id="username" name="username" type="text" autocomplete="username" required>

				<label for="password">Password <span class="required">*</span></label>
				<input id="password" name="password" type="password" autocomplete="new-password" required>

				<label for="month">Date of Birth <span class="required">*</span></label>
				<div class="date-of-birth">
					<select id="month" name="month" aria-label="Month" required>
						<option value="" disabled selected>Month</option>
					</select>
					<select id="day" name="day" aria-label="Day" required>
						<option value="" disabled selected>Day</option>
					</select>
					<select id="year" name="year" aria-label="Year" required>
						<option value="" disabled selected>Year</option>
					</select>
				</div>

				<label class="checkbox-row">
					<input type="checkbox" name="emailUpdates">
					<span class="checkbox-text">
						(Optional) It's okay to send me emails with Discord updates, tips, and special offers. You can opt out at any time.
					</span>
				</label>

				<label class="checkbox-row terms-row">
					<input type="checkbox" name="terms" required>
					<span class="checkbox-text">
						I have read and agree to Discord's
						<a href="#">Terms of Service</a> and
						<a href="#">Privacy Policy</a>.
					</span>
				</label>

				<button type="submit">Create Account</button>
			</form>

			<p class="login-link">
				<a href="./login.html" data-page-transition>Already have an account? Log in</a>
			</p>
		</section>
	</main>
</body>

</html>
