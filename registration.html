<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="./css/register.css">
    <title>Discord Registration</title>
</head>
<body>
    <main class="register-card">
        <section class="register-section">
            <h1>Create an account</h1>

            <form onsubmit="return false;">
                <label for="email">Email <span>*</span></label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="email"
                    required
                    autofocus
                >

                <label for="display-name">Display Name</label>
                <input
                    id="display-name"
                    name="displayName"
                    type="text"
                    autocomplete="nickname"
                >

                <label for="username">Username <span>*</span></label>
                <input
                    id="username"
                    name="username"
                    type="text"
                    autocomplete="username"
                    required
                >

                <label for="password">Password <span>*</span></label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="new-password"
                    required
                >

                <label>Date of Birth <span>*</span></label>
                <div class="date-of-birth">
                    <select id="month" name="month" aria-label="Month" required>
                        <option value="" disabled selected>Month</option>
                        <option value="1">January</option>
                        <option value="2">February</option>
                        <option value="3">March</option>
                        <option value="4">April</option>
                        <option value="5">May</option>
                        <option value="6">June</option>
                        <option value="7">July</option>
                        <option value="8">August</option>
                        <option value="9">September</option>
                        <option value="10">October</option>
                        <option value="11">November</option>
                        <option value="12">December</option>
                    </select>

                    <select id="day" name="day" aria-label="Day" required>
                        <option value="" disabled selected>Day</option>
                        <!-- Days 1–31 -->
                        <option>1</option>
                        <option>2</option>
                        <option>3</option>
                        <option>4</option>
                        <option>5</option>
                        <option>6</option>
                        <option>7</option>
                        <option>8</option>
                        <option>9</option>
                        <option>10</option>
                        <option>11</option>
                        <option>12</option>
                        <option>13</option>
                        <option>14</option>
                        <option>15</option>
                        <option>16</option>
                        <option>17</option>
                        <option>18</option>
                        <option>19</option>
                        <option>20</option>
                        <option>21</option>
                        <option>22</option>
                        <option>23</option>
                        <option>24</option>
                        <option>25</option>
                        <option>26</option>
                        <option>27</option>
                        <option>28</option>
                        <option>29</option>
                        <option>30</option>
                        <option>31</option>
                    </select>

                    <select id="year" name="year" aria-label="Year" required>
                        <option value="" disabled selected>Year</option>
                        <option>2026</option>
                        <option>2025</option>
                        <option>2024</option>
                        <option>2023</option>
                        <option>2022</option>
                        <option>2021</option>
                        <option>2020</option>
                        <option>2019</option>
                        <option>2018</option>
                        <option>2017</option>
                        <option>2016</option>
                        <option>2015</option>
                        <option>2014</option>
                        <option>2013</option>
                        <option>2012</option>
                        <option>2011</option>
                        <option>2010</option>
                        <option>2009</option>
                        <option>2008</option>
                        <option>2007</option>
                        <option>2006</option>
                        <option>2005</option>
                        <option>2004</option>
                        <option>2003</option>
                        <option>2002</option>
                        <option>2001</option>
                        <option>2000</option>
                    </select>
                </div>

                <label class="checkbox-row">
                    <input type="checkbox" name="emailUpdates">
                    <span class="checkbox-text">
                        (Optional) It's okay to send me emails with
                        Discord updates, tips, and special offers.
                        You can opt out at any time.
                    </span>
                </label>

                <label class="checkbox-row terms-row">
                    <input type="checkbox" name="terms" required>
                    <span class="checkbox-text">
                        I have read and agree to Discord's
                        <a href="#">Terms of Service</a> and
                        <a href="#">Privacy Policy</a>.
                    </span>
                </label>

                <button type="submit">Create Account</button>
            </form>

            <p class="login-link">
                <a href="./login.html">Already have an account? Log in</a>
            </p>
        </section>
    </main>
</body>
</html>
