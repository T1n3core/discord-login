<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Discord Login</title>
	<link rel="stylesheet" href="./css/shared.css">
	<link rel="stylesheet" href="./css/login.css">
	<script src="./js/page-transition.js" defer></script>
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>
	<script src="./js/demo-auth.js" defer></script>
</head>

<body>
	<img src="./assets/discord_logo.svg" alt="Discord logo" class="discord-logo">

	<main class="login-card">
		<section class="login-section">
			<h1>Welcome back!</h1>
			<p class="subtitle">We're so excited to see you again!</p>

			<form data-demo-form data-demo-title="Demo Login">
				<label for="email">Email or Phone Number <span class="required">*</span></label>
				<input id="email" name="email" type="text" autocomplete="username" required>

				<label for="password">Password <span class="required">*</span></label>
				<input id="password" name="password" type="password" autocomplete="current-password" required>

				<a href="#" class="forgot">Forgot your password?</a>
				<button type="submit">Log In</button>
			</form>

			<p class="register">Need an account? <a href="./registration.html" data-page-transition>Register</a></p>
		</section>

		<section class="qr-section">
			<div class="qr-placeholder">
				<div class="qr-pattern"></div>
			</div>
			<h2>Log in with QR Code</h2>
			<p>Scan this with the Discord mobile<br>app to log in instantly.</p>
			<a href="#" class="passkey">Or sign in with a passkey</a>
		</section>
	</main>
</body>

</html>
